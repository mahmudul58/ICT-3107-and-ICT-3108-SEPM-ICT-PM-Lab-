<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
</head>
<body>
<h2>Student Management</h2>

<form th:action="@{/users}" method="post">
    <label for="nameInput">Name:</label>
    <input type="text" id="nameInput" name="name" required />

    <label for="idInput">Student ID:</label>
    <input type="text" id="idInput" name="studentId" required />

    <label for="cgpaInput">CGPA:</label>
    <input type="number" step="0.01" id="cgpaInput" name="cgpa" required />

    <button type="submit">Add Student</button>
</form>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Student ID</th>
        <th>CGPA</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.name}"></td>
        <td th:text="${u.studentId}"></td>
        <td th:text="${u.cgpa}"></td>
        <td>
            <a th:href="@{'/users/edit/' + ${u.id}}">Update</a>
            <form th:action="@{'/users/delete/' + ${u.id}}" method="post" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
