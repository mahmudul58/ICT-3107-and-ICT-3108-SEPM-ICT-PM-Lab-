<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
</head>
<body>
<h2>Edit Student</h2>

<form th:action="@{/users/update}" th:object="${user}" method="post">
    <input type="hidden" th:field="*{id}" />

    <label for="editName">Name:</label>
    <input type="text" id="editName" th:field="*{name}" required />
    <br/>

    <label for="editStudentId">Student ID:</label>
    <input type="text" id="editStudentId" th:field="*{studentId}" required />
    <br/>

    <label for="editCgpa">CGPA:</label>
    <input type="number" step="0.01" id="editCgpa" th:field="*{cgpa}" required />
    <br/>

    <button type="submit">Update</button>
</form>
</body>
</html>
